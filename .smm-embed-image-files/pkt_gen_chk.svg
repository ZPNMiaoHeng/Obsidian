<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:svgjs="http://svgjs.dev/svgjs" style="background-color: rgb(255, 255, 255);"><title></title><style>
  /* 鼠标hover和激活时渲染的矩形 */
  .smm-hover-node{
    display: none;
    opacity: 0.6;
    stroke-width: 1;
  }

  .smm-node:not(.smm-node-dragging):hover .smm-hover-node{
    display: block;
  }

  .smm-node.active .smm-hover-node, .smm-node-highlight .smm-hover-node{
    display: block;
    opacity: 1;
    stroke-width: 2;
  }

  .smm-text-node-wrap, .smm-expand-btn-text {
    user-select: none;
  }

  .smm-desctext-node-wrap {
    word-break: break-all;
    user-select: none;
  }

      .smm-richtext-node-wrap {
        word-break: break-all;
        user-select: none;
      }

      .ql-editor .ql-align-left, 
      .smm-richtext-node-wrap .ql-align-left {
        text-align: left;
      }

      .smm-richtext-node-wrap .ql-align-right {
        text-align: right;
      }

      .smm-richtext-node-wrap .ql-align-center {
        text-align: center;
      }
      </style></svg>